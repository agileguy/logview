[project]
name = "logview"
dynamic = ["version"]
description = "A testable, responsive log viewer TUI with pluggable log source contexts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dan" }]
keywords = ["tui", "logs", "gcp", "gke", "syslog", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "textual>=0.45.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gcp = ["google-cloud-logging>=3.0.0"]
gke = ["kubernetes>=28.0.0"]
all = ["google-cloud-logging>=3.0.0", "kubernetes>=28.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
    "syrupy>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "coverage>=7.0.0",
]

[project.scripts]
logview = "logview.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/logview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["google.*", "google.cloud.*", "google.api_core.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long, handled by formatter

[tool.coverage.run]
source = ["src/logview"]
branch = true
omit = [
    # Entry point - hard to test
    "src/logview/__main__.py",
    # Placeholder adapters (Phase 3+)
    "src/logview/adapters/gcp.py",
    "src/logview/adapters/gke.py",
    # Placeholder UI components (Phase 3+)
    "src/logview/domain/context.py",
    "src/logview/ui/screens/help.py",
    "src/logview/ui/screens/main.py",
    "src/logview/ui/widgets/log_entry.py",
    "src/logview/ui/widgets/status_bar.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
